<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palette Pair Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Palette Pair</h1>
    <form id="login-form">
      <label>Email <input id="email" type="email" required></label>
      <label>Password <input id="password" type="password" required minlength="6"></label>
      <button type="submit">Log in</button>
      <button type="button" id="register">Create account</button>
    </form>
    <p id="message" role="status"></p>
    <section id="profile" hidden>
      <p id="user-email"></p>
      <label>Name <input id="display-name"></label>
      <button id="save-profile">Save profile</button>
      <button id="logout">Log out</button>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
