<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LUA – Every Colour Has a Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&family=Poppins:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <main class="card">
            <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>

            <header class="nav">
                <a class="logo" href="#" aria-label="LUA home">LUA</a>
                <nav class="links" id="menu" aria-label="Main">
                    <a href="#" class="active">Home</a>
                    <a href="#palette">Palette</a>
                    <a href="#wheel">Color wheel</a>
                </nav>
                <a class="btn-outline" href="#">Explore
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 11 11 3M5 3h6v6" />
                    </svg>
                </a>
                <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false"
                    aria-controls="menu"><span></span><span></span></button>
            </header>

            <section class="hero">
                <div class="copy">
                    <h1>Every<br><span class="grad">Colour</span> has<br>a story.<br>Create yours.</h1>
                    <p class="sub">Discover. Mix. Be Inspired.<br>with LUA.</p>
                    <div class="actions">
                        <a class="btn-dark" href="#">Start Exploring
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                                stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 8h12M9 3l5 5-5 5" />
                            </svg>
                        </a>
                        <a class="demo" href="#"><span class="play"><svg width="14" height="14" viewBox="0 0 14 14">
                                    <path d="M3 1.5v11l9-5.5z" fill="currentColor" />
                                </svg></span>Watch Demo</a>
                    </div>
                </div>

                <div class="visual" id="visual">
                    <div class="frame"></div>
                    <div class="float">
                        <svg class="ribbon" viewBox="0 0 740 620" aria-hidden="true">
                            <defs>
                                <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0" stop-color="#2f7be0" />
                                    <stop offset=".5" stop-color="#5fb0ee" />
                                    <stop offset="1" stop-color="#a9d8f6" />
                                </linearGradient>
                                <linearGradient id="gp" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0" stop-color="#6f4fd2" />
                                    <stop offset=".55" stop-color="#b872d8" />
                                    <stop offset="1" stop-color="#d98ad6" />
                                </linearGradient>
                                <linearGradient id="go" x1="0" y1="1" x2="1" y2="0">
                                    <stop offset="0" stop-color="#f4670f" />
                                    <stop offset=".6" stop-color="#fa8a2e" />
                                    <stop offset="1" stop-color="#ffb066" />
                                </linearGradient>
                            </defs>
                            <path fill="url(#gb)"
                                d="M5 165C15 75 85 28 140 30C215 34 330 120 490 225C400 190 290 150 215 160C165 168 135 215 140 290C146 380 190 440 188 500C150 470 95 395 70 330C45 270 0 235 5 165Z" />
                            <path fill="#fff" opacity=".28"
                                d="M60 150C100 60 160 55 230 95C170 90 110 120 95 220C80 200 55 190 60 150Z" />
                            <path fill="url(#go)"
                                d="M330 430C420 330 520 300 600 200C650 140 700 110 740 100L740 480C690 520 620 560 540 545C450 530 380 490 330 430Z" />
                            <path fill="url(#gp)"
                                d="M140 215C190 165 290 200 340 290C390 375 470 440 560 450C470 480 350 470 290 410C245 365 215 300 190 275C165 255 140 250 140 215Z" />
                            <path fill="url(#go)" opacity=".92"
                                d="M300 440C420 540 560 600 740 600L740 480C640 540 520 520 300 440Z" />
                            <g fill="none" stroke="#fff" stroke-linecap="round" opacity=".55">
                                <path d="M140 30C215 34 330 120 490 225" stroke-width="1.6" />
                                <path d="M215 160C290 150 400 190 490 225" stroke-width="1" />
                                <path d="M340 290C390 375 470 440 560 450" stroke-width="1.2" />
                                <path d="M600 200C650 140 700 110 740 100" stroke-width="1.2" />
                            </g>
                        </svg>
                    </div>
                    <svg class="spark" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M12 1C12.8 8 16 11.2 23 12 16 12.8 12.8 16 12 23 11.2 16 8 12.8 1 12 8 11.2 11.2 8 12 1Z"
                            fill="#4a5568" />
                    </svg>
                    <div class="palette-card" id="palette">
                        <div class="dots">
                            <button class="dot" data-hex="#3B8FD9" style="background:#3b8fd9"
                                aria-label="Copy #3B8FD9"></button>
                            <button class="dot" data-hex="#8A63C9" style="background:#8a63c9"
                                aria-label="Copy #8A63C9"></button>
                            <button class="dot" data-hex="#F7791F" style="background:#f7791f"
                                aria-label="Copy #F7791F"></button>
                            <button class="dot" data-hex="#1B2C4A" style="background:#1b2c4a"
                                aria-label="Copy #1B2C4A"></button>
                        </div>
                        <p id="paletteLabel">Your Palette</p>
                    </div>
                </div>
            </section>

            <footer class="foot">
                <span class="rule"></span>
                <span class="tag">Build &bull; Innovate &bull; Automate</span>
                <button class="scroll" id="scrollBtn" aria-label="Scroll down"><svg width="14" height="14"
                        viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M7 2v10M3 8l4 4 4-4" />
                    </svg></button>
            </footer>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
