<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LUA – Every Colour Has a Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=Poppins:wght@700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="home.css">
</head>

<body>
    <div class="page">
        <main class="card">
            <!-- Ambient pastel background glows -->
            <span class="blob b1" aria-hidden="true"></span>
            <span class="blob b2" aria-hidden="true"></span>
            <span class="blob b3" aria-hidden="true"></span>

            <!-- Navigation header -->
            <header class="nav">
                <a class="logo" href="#" aria-label="LUA home">LUA</a>
                <nav class="links" id="menu" aria-label="Main">
                    <a href="#" class="active">Home</a>
                    <a href="#palette">Palette</a>
                    <a href="#wheel">Color wheel</a>
                </nav>
                <a class="btn-outline" href="#">Explore
                    <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 11 11 3M5 3h6v6" />
                    </svg>
                </a>
                <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false"
                    aria-controls="menu"><span></span><span></span></button>
            </header>

            <!-- Hero section -->
            <section class="hero">
                <div class="copy">
                    <h1>EVERY<br><span class="grad">COLOUR</span> HAS<br>A STORY.<br>CREATE YOURS.</h1>
                    <p class="sub">Discover. Mix. Be Inspired.<br>with LUA.</p>
                    <div class="actions">
                        <a class="btn-dark" href="#">Start Exploring
                            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 8h12M9 3l5 5-5 5" />
                            </svg>
                        </a>
                        <a class="demo" href="#"><span class="play"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
                                    <path d="M2.5 1.5v9l7.5-4.5z" fill="currentColor" />
                                </svg></span>Watch Demo</a>
                    </div>
                </div>

                <div class="visual" id="visual">
                    <div class="float">
                        <img class="hero-ribbon-img" src="hero-ribbon.png" alt="Fluid color ribbon sculpture" width="540" height="540" />
                    </div>
                    <div class="palette-card" id="palette">
                        <div class="dots">
                            <button class="dot" data-hex="#3B8FD9" style="background:#3b8fd9"
                                aria-label="Copy #3B8FD9" title="Copy #3B8FD9"></button>
                            <button class="dot" data-hex="#8A63C9" style="background:#8a63c9"
                                aria-label="Copy #8A63C9" title="Copy #8A63C9"></button>
                            <button class="dot" data-hex="#F7791F" style="background:#f7791f"
                                aria-label="Copy #F7791F" title="Copy #F7791F"></button>
                            <button class="dot" data-hex="#1B2C4A" style="background:#1b2c4a"
                                aria-label="Copy #1B2C4A" title="Copy #1B2C4A"></button>
                        </div>
                        <p id="paletteLabel">Your Palette</p>
                    </div>
                </div>
            </section>

            <!-- Bottom footer -->
            <footer class="foot">
                <span class="rule" aria-hidden="true"></span>
                <span class="tag">BUILD &bull; INNOVATE &bull; AUTOMATE</span>
                <button class="scroll" id="scrollBtn" aria-label="Scroll down"><svg width="14" height="14"
                        viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M7 2v10M3 8l4 4 4-4" />
                    </svg></button>
            </footer>
        </main>
    </div>
    <script src="home.js"></script>
</body>

</html>
