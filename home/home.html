<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LUA – Every Colour Has a Story</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="home.css">
</head>

<body>
    <div class="page">
        <main class="card">
            <!-- Navigation header -->
            <header class="nav">
                <a class="logo" href="#" aria-label="LUA home">
                    <img src="logo.png" alt="LUA" class="logo-img" width="130" height="44" />
                </a>
                <nav class="links" id="menu" aria-label="Main">
                    <a href="#" class="active">Home</a>
                    <a href="../palette_pair/index.html">Palette</a>
                    <a href="../palette_pair/index.html#contrast-title">Color Wheel</a>
                </nav>
                <a class="btn-outline" href="../login/public.html">Login
                    <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 11 11 3M5 3h6v6" />
                    </svg>
                </a>
                <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false"
                    aria-controls="menu"><span></span><span></span></button>
            </header>

            <!-- Hero section -->
            <section class="hero">
                <div class="copy">
                    <h1>EVERY<br><span class="grad">COLOUR</span> HAS<br>A STORY.<br>CREATE YOURS.</h1>
                    <p class="sub">Discover. Mix. Be Inspired<br>with LUA.</p>
                    <div class="actions">
                        <a class="btn-dark" href="../palette_pair/index.html">Start Exploring
                            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 8h12M9 3l5 5-5 5" />
                            </svg>
                        </a>
                    </div>
                </div>

                <div class="visual" id="visual">
                    <div class="palette-card" id="palette">
                        <div class="dots">
                            <button class="dot" data-hex="#1C84D9" style="background:#1c84d9"
                                aria-label="Copy #1C84D9" title="Copy #1C84D9"></button>
                            <button class="dot" data-hex="#AB55F8" style="background:#ab55f8"
                                aria-label="Copy #AB55F8" title="Copy #AB55F8"></button>
                            <button class="dot" data-hex="#FF7E2B" style="background:#ff7e2b"
                                aria-label="Copy #FF7E2B" title="Copy #FF7E2B"></button>
                        </div>
                        <p id="paletteLabel">Our Palette</p>
                    </div>
                </div>
            </section>

            <!-- Bottom footer -->
            <footer class="foot">
                <span class="rule" aria-hidden="true"></span>
                <span class="tag">IMAGINE &bull; EXPLORE &bull; CREATE</span>
            </footer>
        </main>
    </div>
    <script src="home.js"></script>
</body>

</html>
